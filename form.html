<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Form Example Exercise">

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>

    <title>Form Example</title>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">
            <label>Product Name
                <select name="products" id="products" required>
                    <option value="" disabled selected>Please Select &#9662;</option>
                </select>
            </label>

            <label id="rating">Overall Rating
                <div class="stars">
                    <input type="radio" id="fivestar" name="stars" value="5" required><label for="fivestar"></label>
                    <input type="radio" id="fourstar" name="stars" value="4" required><label for="fourstar"></label>
                    <input type="radio" id="threestar" name="stars" value="3" required><label for="threestar"></label>
                    <input type="radio" id="twostar" name="stars" value="2" required><label for="twostar"></label>
                    <input type="radio" id="onestar" name="stars" value="1" required><label for="onestar"></label>
                </div>
            </label>

            <label id="instalationDate">Date Of Instalation
                <input type="date" name="date" required>
            </label>

            <div id="features">Which features did you find useful in the product?
                <p>(Check all that apply)</p>
                <label><input type="checkbox" name="durability" value="yes"> Durability</label>
                <label><input type="checkbox" name="ease" value="yes"> Ease of Use</label>
                <label><input type="checkbox" name="performance" value="yes"> Performance</label>
                <label><input type="checkbox" name="design" value="yes"> Design</label>
            </div>

            <label>Written Review <span>(Optional)</span>
                <textarea id="writtenReview" name="writtenReview"></textarea>
            </label>

            <label>Your Name <span>(Optional)</span>
                <input type="text" name="name" id="name">
            </label>

            <input type="submit" id="button" value="Make a Review">
        </form>
    </main>

    <footer>
        <p>©<span id="currentYear"></span> | Elías Rodríguez | Soriano - Uruguay</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
